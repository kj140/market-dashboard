[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dash"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "yfinance>=0.2.40", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
